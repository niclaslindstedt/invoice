<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `viewport-fit=cover` lets the app paint under the notch / home
         indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Invoice — invoicing on your device</title>
    <meta
      name="description"
      content="Invoice is a local-first invoicing PWA. Register your company and your customers, write invoices against a template, rearrange the page in an edit mode, and print or save the result as a PDF — all on your device. Swedish invoicing rules built in, more regions to follow. Drop a file exported from the Time app onto an invoice and its hours become lines."
    />
    <link rel="canonical" href="https://invoice.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invoice" />
    <meta
      property="og:description"
      content="A privacy-first invoicing app: customers, company details, templates and invoices, laid out on a page you can rearrange and printed from the device. No account, no server."
    />
    <meta property="og:url" content="https://invoice.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://invoice.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Invoice" />
    <meta
      name="twitter:description"
      content="A privacy-first invoicing app: customers, company details, templates and invoices, laid out on a page you can rearrange and printed from the device. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://invoice.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Invoice",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "description": "A local-first invoicing PWA: your company, your customers, templates and invoices, laid out on a page you can rearrange and printed from the device. Swedish invoicing rules built in. Optional storage in a local folder or Dropbox.",
        "url": "https://invoice.niclaslindstedt.se/",
        "image": "https://invoice.niclaslindstedt.se/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
